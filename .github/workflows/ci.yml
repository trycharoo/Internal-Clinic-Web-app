name: Clinic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow and script validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color
      - run: sh -n services/doc-parser/install-debian.sh

  backend:
    name: Backend proxy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix backend

  parser:
    name: Document parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils libgl1
      - run: python -m pip install -r services/doc-parser/requirements-dev.txt
      - run: python -m pytest services/doc-parser/test_app.py

  frontend:
    name: Unit, component and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves the production bundle, then exercises desktop and mobile.
      - run: npm run test:e2e
      - name: Upload coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-test-reports
          path: |
            coverage/
            playwright-report/
            .context/test-results/
          include-hidden-files: true
          retention-days: 14
